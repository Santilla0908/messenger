<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8">
		<title>Мессенджер</title>
		<link rel="stylesheet" href="style.css">
		<script src="base.js"></script>
	</head>
	<body>
		<button id="open_messenger">Открыть чат</button>
	</body>
	<script>
		const openMessengerEl = document.querySelector('#open_messenger');
		let isLoadingMessengerApp = false;
		openMessengerEl.addEventListener('click', () => {
			const messengerAppEl = document.querySelector('.messenger_app');
			if (messengerAppEl) {
				messengerAppEl.classList.remove('hidden');
				openMessengerEl.classList.add('hidden');
			} else {
				if (isLoadingMessengerApp) return;
				isLoadingMessengerApp = true;
				import('./messenger-app.js').then(() => {
					const messengerAppEl = document.createElement('messenger-app');
					messengerAppEl.classList.add('messenger_app');
					document.body.append(messengerAppEl);
					openMessengerEl.classList.add('hidden');
					isLoadingMessengerApp = false;
				});
			}
		});
		document.addEventListener('close-messenger', () => {
			const messengerAppEl = document.querySelector('.messenger_app');
			messengerAppEl.classList.add('hidden');
			openMessengerEl.classList.remove('hidden');
		});
		openMessengerEl.click();
	</script>
</html>
